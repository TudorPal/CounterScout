<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CounterScout — FACEIT Bridge</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>CounterScout</h1><p>FACEIT → your local app</p>
<label for="token">Pairing code from Import</label><input id="token" type="password" autocomplete="off">
<label class="toggle"><input id="enabled" type="checkbox"> Enable team sync and automatic demo imports</label>
<button id="connect">Save & connect</button><button id="sync">Sync current FACEIT page</button>
<p id="status" role="status">Not connected yet.</p><p class="hint">Downloads must finish before import starts. Keep the backend running. Login and download permissions stay with FACEIT.</p>
<script src="popup.js"></script></body></html>
